[package]
name = "cache-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CACHE desktop shell (Tauri) — same offline web UI, local filesystem"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
